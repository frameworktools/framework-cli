name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o fw-bin ./cmd/fw
        env:
          CGO_ENABLED: "0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # fw, R's keyring package, and Python's keyring must share one login. This
  # runs a real Secret Service (gnome-keyring) and checks each tool reads the
  # others' entries.
  keyring-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-dev libsodium-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("keyring")'
      - run: python3 -m pip install --user keyring secretstorage
      # The Python-writes check needs framework-py's own keyring helpers. It
      # is skipped until framework-py is published.
      - name: Install framework-py if published
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: python3 -m pip install --user "framework-py @ git+https://github.com/frameworktools/framework-py" || echo "framework-py is not available; the Python-writes check will be skipped"
      - name: Round-trip tokens through the Secret Service
        run: |
          dbus-run-session -- sh -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            go test -tags interop ./internal/keyring -run Interop -v
          '
