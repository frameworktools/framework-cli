# Release builds: one static binary per platform, archives and checksums on
# GitHub Releases, and the Homebrew tap. Run by .github/workflows/release.yml
# when a v* tag is pushed.
version: 2

project_name: fw

before:
  hooks:
    # The docs site for cli.framework.pub: docs/site plus reference.json
    # generated from the command tree. framework-cloud imports it from the
    # release.
    - go run ./tools/docsite --version {{ .Version }} --out build/docs-site.tar.gz

builds:
  - id: fw
    main: ./cmd/fw
    binary: fw
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/frameworktools/framework-cli/internal/cli.version={{.Version}}
      - -X github.com/frameworktools/framework-cli/internal/cli.commit={{.ShortCommit}}
      - -X github.com/frameworktools/framework-cli/internal/cli.date={{.Date}}

archives:
  # framework-cloud's scaffold workflow downloads fw_<version>_linux_amd64.tar.gz
  # and expects the fw binary at the top level. Keep these names stable.
  - name_template: "fw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# Sign and notarize the macOS binaries from Linux (GoReleaser runs quill).
# Skipped when the secrets are absent, as in snapshot builds and forks.
# Bare binaries cannot be stapled, so Gatekeeper checks the notarization
# online the first time fw runs.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [fw]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: "fw_{{ .Version }}_checksums.txt"

release:
  extra_files:
    - glob: ./build/docs-site.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: fw
    binaries: [fw]
    repository:
      owner: frameworktools
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://framework.pub
    description: Command-line helper for Framework projects and Framework Cloud
    license: MIT
